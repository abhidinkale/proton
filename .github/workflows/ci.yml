name: Proton CI & Clinical Safety Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package.json
            apps/web/package.json

      - name: Install API Dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Install Web Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Type-Check & Build Web
        working-directory: ./apps/web
        run: npm run build

      - name: Deterministic API & Clinical Safety Suites
        working-directory: ./apps/api
        env:
          NODE_ENV: test
        run: npm test
