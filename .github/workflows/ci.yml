name: Proton CI & Clinical Safety Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs. On the free 2000-minute CI budget, a stale run on an
# old commit is pure waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proton_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Workflow durability tests create and drop their own throwaway databases
      # derived from this URL.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/proton_ci
      # A skipped durability suite is a failed gate in CI.
      REQUIRE_POSTGRES: '1'
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API Dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Install Web Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Type-Check & Build Web
        working-directory: ./apps/web
        run: npm run build

      - name: Deterministic API, Workflow Durability & Clinical Safety Suites
        working-directory: ./apps/api
        run: npm test

  # The Android patient app is a first-class deliverable, not a side project, so
  # it gets its own gate. It shares no dependencies with the API job.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/dork-android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Roborazzi screenshot *verification* is deliberately not run here: the
      # golden images are recorded on macOS and font rasterisation differs on
      # Linux, which produces false diffs. Screenshots are reviewed locally.
      - name: Unit Tests + Debug Build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proton-debug-apk
          path: apps/dork-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: apps/dork-android/app/build/reports/tests/
          retention-days: 7
