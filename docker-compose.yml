services:
  # ---------------------------------------------------------------------------
  # Durable workflow state. Postgres is the system of record for the encounter
  # state machine, outbox and audit chain; Medplum/FHIR remains the system of
  # record for clinical resources.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: proton-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proton}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (10+ characters)}
      - POSTGRES_DB=${POSTGRES_DB:-proton_ops}
    ports:
      # Loopback only: a dev database must never be reachable from the LAN or
      # the internet. The API uses the compose network, not this binding.
      - "127.0.0.1:5432:5432"
    volumes:
      - proton-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proton} -d ${POSTGRES_DB:-proton_ops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: proton-api
    ports:
      # Loopback only. The web container reaches the API over the compose
      # network, and a developer browser reaches http://localhost:3002.
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      # Fail closed: production refuses to boot without strong, non-default secrets.
      # Export these in your shell or a .env file next to this compose file.
      - PROTON_AUTH_SECRET=${PROTON_AUTH_SECRET:?PROTON_AUTH_SECRET must be set to a random value of at least 32 characters}
      - INTERNAL_AGENT_SECRET=${INTERNAL_AGENT_SECRET:?INTERNAL_AGENT_SECRET must be set to a random value of at least 16 characters}
      - PROTON_SYNTHETIC_MODE=false
      - PROTON_FHIR_PERSISTENCE_MODE=${PROTON_FHIR_PERSISTENCE_MODE:-in_memory}
      # Durable workflow. Production refuses to boot without this.
      - DATABASE_URL=postgres://${POSTGRES_USER:-proton}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proton_ops}
      # apps/api/storage/postgresDb.js enables TLS whenever NODE_ENV=production.
      # The official postgres image has TLS off, so without this the API fails
      # its migrations and exits (production treats that as fatal).
      - PG_DISABLE_SSL=true
      - WORKFLOW_PERSISTENCE=postgres
      - WORKFLOW_SCHEDULER=on
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MEDPLUM_BASE_URL=${MEDPLUM_BASE_URL:-https://api.medplum.com/}
      - MEDPLUM_CLIENT_ID=${MEDPLUM_CLIENT_ID:-}
      - MEDPLUM_TOKEN=${MEDPLUM_TOKEN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Runtime environment variables cannot reach a static Vite bundle; pass them here.
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3002}
        - VITE_MEDPLUM_BASE_URL=${VITE_MEDPLUM_BASE_URL:-http://localhost:8103/}
        # Set to true only for trusted synthetic evaluation deployments.
        - VITE_SYNTHETIC_MODE=${VITE_SYNTHETIC_MODE:-false}
    container_name: proton-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  proton-postgres-data:
